<!doctype html>
<!--
  MARKETS, NARRATED — 1871 → present
  Single-file, replay-only build. No API keys, no model selection, no live
  inference. The only network use is CDN scripts + fonts.

  DATA SOURCE — a Shiller CSV you've downloaded beforehand:
  • Easiest: grab data.csv from github.com/datasets/s-and-p-500 (monthly
    Shiller series: Date, SP500, …, Real Price, PE10), put it next to this
    file, and serve the folder (npx serve .) — it loads automatically.
  • Opened via file:// the browser blocks local fetches, so a load bar
    appears instead: drag the CSV onto it or browse. Same result.
  • Until a CSV is loaded, the chart shows an embedded ANNUAL APPROXIMATION
    (anchored to Shiller's values) and says so on the chart.
  The parser is tolerant: ISO dates (1871-01-01) or Shiller fractional
  dates (1871.01, where .1 means October); uses Real Price + PE10 when
  present, else computes real prices from SP500 × CPI.

  NARRATION — replayed from the corpus embedded between the __CORPUS__
  markers below: 13 era moments × 4 voices, authored offline, played at a
  simulated Cerebras-class cadence (the chip says "simulated"). To replace
  it with passages recorded from a real run (real TTFT / tok-s, label flips
  to "recorded"), run the optional companion script elsewhere:
      node generate-corpus.mjs  (pass your key; add the write flag to
      inject in place, or the years flag for a full per-year corpus)
  Scrubbing snaps to the nearest moment in the corpus; a per-year corpus
  unlocks every year automatically.
-->

<style>

  --ink-soft: #74705F;

}

* { box-sizing: border-box; }

  content: "";
  position: absolute;
  top: -240px; right: -180px;

  border-radius: 2px;
  background: radial-gradient(closest-side, rgba(238,91,43,.07), transparent 70%);
  pointer-events: none;
}

.mn-shell { max-width: 1600px; margin: 0 auto; padding: 28px 28px 30px; position: relative; }

.mn-eyebrow {
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-soft); font-weight: 600;
}
.mn-title {
  font-size: clamp(26px, 3.2vw, 35px);
  font-weight: 300; letter-spacing: -0.02em; line-height: 1.04;

}

/* csv load bar — shown only while on fallback data */

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useMemo, useEffect, useCallback } = React;

/* ── data ────────────────────────────────────────────────────────────────
   Source of truth is a Shiller CSV loaded at runtime. Until one is loaded,
   an embedded annual approximation (anchored to Shiller's values) stands in,
   and the chart labels itself accordingly. */

const FALLBACK_ANCHORS = [
  [1871,110,null],[1874,95,null],[1877,82,null],[1881,142,18.5],[1885,118,16.2],
  [1888,132,17.0],[1892,168,19.4],[1896,118,16.6],[1899,200,22.9],[1901,215,25.2],
  [1903,165,17.2],[1906,245,20.2],[1907,152,12.4],[1909,230,14.9],[1912,222,13.8],
  [1916,235,11.0],[1917,152,6.4],[1920,118,5.1],[1921,112,5.4],[1924,172,8.7],
  [1926,252,11.3],[1928,380,18.8],[1929,455,30.0],[1930,322,16.8],[1931,192,9.6],
  [1932,112,8.3],[1933,162,13.1],[1936,292,17.1],[1937,287,18.2],[1938,205,13.5],
  [1940,192,12.1],[1942,136,8.5],[1945,232,12.0],[1946,268,14.6],[1949,196,10.2],
  [1952,302,12.5],[1956,482,18.3],[1959,585,18.4],[1961,662,21.0],[1965,852,23.7],
  [1966,872,24.1],[1968,882,21.5],[1970,662,14.7],[1972,802,18.7],[1974,392,8.9],
  [1976,542,11.4],[1978,432,9.2],[1980,482,8.9],[1982,338,7.4],[1984,422,9.6],
  [1986,602,14.7],[1987,642,16.1],[1988,542,13.7],[1990,602,15.6],[1992,722,19.8],
  [1994,762,20.3],[1996,1052,24.8],[1998,1752,36.0],[1999,2352,42.0],[2000,2652,43.5],
  [2001,2152,32.0],[2002,1702,24.0],[2003,1552,22.4],[2005,1852,26.5],[2007,2302,27.3],
  [2008,1852,21.0],[2009,1152,15.2],[2011,1752,21.5],[2013,2302,23.5],[2015,2702,26.0],
  [2016,2752,25.7],[2018,3402,31.5],[2019,3502,29.5],[2020,3802,30.5],[2021,5202,37.5],
  [2022,4102,28.5],[2023,4902,30.8],[2024,5902,35.5],[2025,6500,38.5],
];

/* annual rows -> { year, price, cape, drawdown, cagr10 } */
function deriveAnnual(rows) {
  let peak = 0;
  return rows.map((d, i) => {
    peak = Math.max(peak, d.price);
    const tenAgo = rows[i - 10];
    return { ...d, drawdown: (d.price / peak - 1) * 100,
      cagr10: tenAgo ? (Math.pow(d.price / tenAgo.price, 0.1) - 1) * 100 : null };
  });
}

function buildFallback() {
  const raw = [];
  for (let i = 0; i < FALLBACK_ANCHORS.length - 1; i++) {
    const [y0, p0, c0] = FALLBACK_ANCHORS[i];
    const [y1, p1, c1] = FALLBACK_ANCHORS[i + 1];
    for (let y = y0; y < y1; y++) {
      const t = (y - y0) / (y1 - y0);
      const base = Math.exp(Math.log(p0) + (Math.log(p1) - Math.log(p0)) * t);
      const texture = y === y0 ? 1 : 1 + 0.018 * Math.sin(y * 1.7) + 0.012 * Math.sin(y * 4.3 + 1);
      const cape = c0 != null && c1 != null ? c0 + (c1 - c0) * t : t === 0 ? c0 : null;
      raw.push({ year: y, price: +(base * texture).toFixed(1), cape: cape != null ? +cape.toFixed(1) : null });
    }
  }
  const last = FALLBACK_ANCHORS[FALLBACK_ANCHORS.length - 1];
  raw.push({ year: last[0], price: last[1], cape: last[2] });
  return { annual: deriveAnnual(raw), monthly: null, source: "fallback", label: "approximate fallback data", hasNominal: false };
}

/* Tolerant Shiller CSV parser.
   Dates: 1871-01-01 / 1871-01 / Shiller fractional 1871.01 (.1 = October).
   Values: prefers "Real Price" + PE10; else computes real from SP500 × CPI. */
function parseShillerCSV(textContent, label) {
  const lines = textContent.replace(/\r/g, "").split("\n").filter((l) => l.trim());
  if (lines.length < 2) throw new Error("That file looks empty.");
  const header = lines[0].split(",").map((h) => h.trim().toLowerCase());
  const find = (re) => header.findIndex((h) => re.test(h));
  const di = find(/^date/);
  const rpi = find(/^real ?price/);
  const pei = find(/pe ?10|cape/);
  const spi = find(/^(sp ?500|s&p|price)$/);
  const cpii = find(/consumer|cpi/);
  if (di < 0) throw new Error("No Date column found — is this the Shiller CSV?");
  if (rpi < 0 && (spi < 0 || cpii < 0))
    throw new Error("Need a Real Price column, or SP500 + CPI to compute one.");

  const monthly = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(",");
    const rawDate = (cells[di] || "").trim();
    if (!rawDate) continue;
    let year, month;
    if (rawDate.includes("-")) {
      const parts = rawDate.split("-");
      year = +parts[0]; month = +parts[1] || 6;
    } else if (rawDate.includes(".")) {
      const [y, f] = rawDate.split(".");
      year = +y; month = f === "1" ? 10 : +f; // Shiller: .1 is October, .10 truncated
    } else { year = +rawDate; month = 6; }
    if (!Number.isFinite(year) || year < 1800 || year > 2100) continue;

    const real = rpi >= 0 ? parseFloat(cells[rpi]) : NaN;
    const nominal = spi >= 0 ? parseFloat(cells[spi]) : NaN;
    const cpi = cpii >= 0 ? parseFloat(cells[cpii]) : NaN;
    const cape = pei >= 0 ? parseFloat(cells[pei]) : NaN;
    monthly.push({ year, month: Math.min(12, Math.max(1, month || 6)),
      real, nominal, cpi, cape: Number.isFinite(cape) ? cape : null });
  }
  if (monthly.length < 120) throw new Error("Fewer than ten years of rows — wrong file?");

  // realize prices: prefer the Real Price column, else nominal × (latest CPI / CPI)
  let latestCPI = null;
  for (let i = monthly.length - 1; i >= 0; i--) if (Number.isFinite(monthly[i].cpi)) { latestCPI = monthly[i].cpi; break; }
  for (const m of monthly) {
    m.price = Number.isFinite(m.real) ? m.real
      : Number.isFinite(m.nominal) && Number.isFinite(m.cpi) && latestCPI ? m.nominal * (latestCPI / m.cpi)
      : NaN;
  }
  const clean = monthly.filter((m) => Number.isFinite(m.price) && m.price > 0);
  if (clean.length < 120) throw new Error("Couldn't read usable prices from that file.");

  const hasNominal = clean.some((m) => Number.isFinite(m.nominal) && m.nominal > 0);

  // annual aggregates (means)
  const byYearMap = new Map();
  for (const m of clean) {
    const b = byYearMap.get(m.year) || { year: m.year, ps: [], ns: [], cs: [] };
    b.ps.push(m.price);
    if (Number.isFinite(m.nominal) && m.nominal > 0) b.ns.push(m.nominal);
    if (m.cape != null) b.cs.push(m.cape);
    byYearMap.set(m.year, b);
  }
  const years = [...byYearMap.keys()].sort((a, b) => a - b);
  const annualRows = [];
  for (let y = years[0]; y <= years[years.length - 1]; y++) {
    const b = byYearMap.get(y);
    if (!b) continue; // tolerate gaps by skipping (scrub clamps to range)
    const mean = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length;
    annualRows.push({ year: y, price: +mean(b.ps).toFixed(1),
      nominal: b.ns.length ? +mean(b.ns).toFixed(1) : null,
      cape: b.cs.length ? +mean(b.cs).toFixed(1) : null });
  }
  return { annual: deriveAnnual(annualRows), monthly: clean, source: "csv", label, hasNominal };
}

const byYear = (annual, y) => {
  const min = annual[0].year, max = annual[annual.length - 1].year;
  const c = Math.min(Math.max(y, min), max);
  return annual.find((d) => d.year === c) || annual[annual.length - 1];
};

/* ── replay engine ───────────────────────────────────────────────────────── */

const REPLAY_YEARS = [...new Set(Object.keys(CORPUS.passages).map((k) => +k.split(":")[0]))]
  .sort((a, b) => a - b);
const nearestReplayYear = (y) =>
  REPLAY_YEARS.reduce((best, yr) => (Math.abs(yr - y) < Math.abs(best - y) ? yr : best), REPLAY_YEARS[0]);

function replayNarration({ passage, signal, onDelta }) {
  return new Promise((resolve, reject) => {
    const text = typeof passage === "string" ? passage : passage.text;
    const ttft = (passage.ttft ?? CORPUS.meta.ttft) || 170;
    const tps = (passage.tps ?? CORPUS.meta.tps) || 2100;
    const recorded = Boolean(CORPUS.meta.recorded);
    const charsPerSec = tps * 4;
    const t0 = performance.now();
    let timer = null;

    const finish = () => resolve({
      text, recorded,
      ms: Math.round(ttft + (text.length / charsPerSec) * 1000),
      ttft: Math.round(ttft), tps,
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      onDelta(text);
      return finish();
    }

    let shown = 0;
    const step = () => {
      shown = Math.min(text.length, shown + Math.max(2, Math.round(charsPerSec * 0.03)));
      onDelta(text.slice(0, shown));
      if (shown < text.length) timer = setTimeout(step, 30);
      else finish();
    };
    timer = setTimeout(step, ttft);

    signal.addEventListener("abort", () => {
      clearTimeout(timer);
      reject(new DOMException("aborted", "AbortError"));
    });
  });
}

const VW = 1400;
const PRICE_TOP = 12, PRICE_BOTTOM = 134;
const CAPE_TOP = 150, CAPE_BOTTOM = 178;
const VH = 186;
const PAD_L = 48, PAD_R = 18;

const xPct = (year, minY, maxY) =>
  ((PAD_L + ((year - minY) / (maxY - minY)) * (VW - PAD_L - PAD_R)) / VW) * 100;

/* ── analysis helpers ────────────────────────────────────────────────────── */

const priceOf = (row, basis) => (basis === "nominal" ? row.nominal : row.price);

function niceTicks(max, count) {
  if (!(max > 0)) return [];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const ticks = [];
  for (let v = step; v < max; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

// trailing simple moving average over `win` points
function movingAverage(pts, win) {
  if (win <= 1) return pts.map((p) => ({ x: p.x, v: p.price }));
  const out = [];
  let sum = 0;
  const q = [];
  for (const p of pts) {
    q.push(p.price); sum += p.price;
    if (q.length > win) sum -= q.shift();
    if (q.length === win) out.push({ x: p.x, v: sum / win });
  }
  return out;
}

  // annual series on the active basis, with running-peak drawdown
  const basisRows = useMemo(() => {
    let peak = 0;
    return annual.map((r) => {
      const p = priceOf(r, basis);
      if (p > 0) peak = Math.max(peak, p);
      return { year: r.year, p, cape: r.cape, dd: p > 0 && peak > 0 ? (p / peak - 1) * 100 : 0 };
    });
  }, [annual, basis]);

  const byYr = useMemo(() => new Map(basisRows.map((r) => [r.year, r])), [basisRows]);

  // high-resolution source points for the price line (monthly if available)
  const srcPts = useMemo(() => {
    if (monthly) {
      return monthly.map((m) => ({
        x: m.year + (m.month - 0.5) / 12,
        price: basis === "nominal" ? m.nominal : m.price,
        cape: m.cape,
      }));
    }
    return basisRows.map((r) => ({ x: r.year, price: r.p, cape: r.cape }));
  }, [monthly, basisRows, basis]);

  const inView = (x) => x >= viewMin - 1 && x <= viewMax + 1;

  const scales = useMemo(() => {
    const vis = srcPts.filter((p) => inView(p.x) && p.price > 0);
    const prices = vis.length ? vis.map((p) => p.price) : [1, 100];
    const lo = Math.min(...prices), hi = Math.max(...prices);
    const xOf = (x) => PAD_L + ((x - viewMin) / (viewMax - viewMin)) * (VW - PAD_L - PAD_R);
    let yOf, grid;
    if (axisMode === "log") {
      const a = Math.log10(lo * 0.8), b = Math.log10(hi * 1.25);
      yOf = (v) => PRICE_BOTTOM - ((Math.log10(v) - a) / (b - a)) * (PRICE_BOTTOM - PRICE_TOP);
      grid = GRID_CANDIDATES.filter((g) => g > lo * 0.8 && g < hi * 1.25);
    } else {
      const top = hi * 1.06;
      yOf = (v) => PRICE_BOTTOM - (v / top) * (PRICE_BOTTOM - PRICE_TOP);
      grid = niceTicks(top, 4);
    }
    // decade ticks across the visible window
    const firstDecade = Math.ceil(viewMin / 20) * 20;
    const decades = [];
    for (let y = firstDecade; y <= viewMax; y += 20) decades.push(y);
    if (viewMax - viewMin <= 40) { // denser ticks when zoomed in
      decades.length = 0;
      const first = Math.ceil(viewMin / 10) * 10;
      for (let y = first; y <= viewMax; y += 10) decades.push(y);
    }
    return { xOf, yOf, grid, decades };
  }, [srcPts, axisMode, viewMin, viewMax]);

  const fmtPrice = (v) => (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : Math.round(v));

  // paths
  const pricePath = useMemo(() => {
    const vis = srcPts.filter((p) => inView(p.x) && p.price > 0);
    return vis.map((p, i) => (i === 0 ? "M" : "L") + scales.xOf(p.x).toFixed(1) + "," + scales.yOf(p.price).toFixed(1)).join(" ");
  }, [srcPts, scales]);

  const maPath = useMemo(() => {
    if (!maOn) return "";
    const win = monthly ? maMonths : Math.max(1, Math.round(maMonths / 12));
    const ma = movingAverage(srcPts.filter((p) => p.price > 0), win).filter((p) => inView(p.x));
    if (ma.length < 2) return "";
    return ma.map((p, i) => (i === 0 ? "M" : "L") + scales.xOf(p.x).toFixed(1) + "," + scales.yOf(p.v).toFixed(1)).join(" ");
  }, [maOn, maMonths, srcPts, monthly, scales]);

  // bear-market bands (drawdown beyond −20% on the active basis)
  const bearBands = useMemo(() => {
    if (!bearsOn) return [];
    const bands = [];
    let start = null;
    for (const r of basisRows) {
      const bear = r.dd <= -20;
      if (bear && start == null) start = r.year;
      if (!bear && start != null) { bands.push([start, r.year]); start = null; }
    }
    if (start != null) bands.push([start, basisRows[basisRows.length - 1].year]);
    return bands
      .map(([a, b]) => [Math.max(a, viewMin), Math.min(b, viewMax)])
      .filter(([a, b]) => b > a);
  }, [bearsOn, basisRows, viewMin, viewMax]);

  // lower panel
  const lower = useMemo(() => {
    if (lowerPanel === "cape") {
      const cpts = srcPts.filter((p) => inView(p.x) && p.cape != null);
      if (cpts.length < 2) return null;
      const capeMax = Math.max(46, ...cpts.map((p) => p.cape)) * 1.05;
      const yc = (c) => CAPE_BOTTOM - (c / capeMax) * (CAPE_BOTTOM - CAPE_TOP);
      const line = cpts.map((p, i) => (i === 0 ? "M" : "L") + scales.xOf(p.x).toFixed(1) + "," + yc(p.cape).toFixed(1)).join(" ");
      const area = line + " L" + scales.xOf(cpts[cpts.length - 1].x).toFixed(1) + "," + CAPE_BOTTOM +
        " L" + scales.xOf(cpts[0].x).toFixed(1) + "," + CAPE_BOTTOM + " Z";
      return { kind: "cape", line, area };
    }
    if (lowerPanel === "return") {
      const rpts = [];
      for (const r of basisRows) {
        const prev = byYr.get(r.year - windowYears);
        if (prev && prev.p > 0 && r.p > 0 && inView(r.year))
          rpts.push({ x: r.year, r: (Math.pow(r.p / prev.p, 1 / windowYears) - 1) * 100 });
      }
      if (rpts.length < 2) return null;
      const rmax = Math.max(8, Math.ceil(Math.max(...rpts.map((p) => Math.abs(p.r))) / 5) * 5);
      const yr = (v) => (CAPE_TOP + CAPE_BOTTOM) / 2 - (v / rmax) * ((CAPE_BOTTOM - CAPE_TOP) / 2);
      const line = rpts.map((p, i) => (i === 0 ? "M" : "L") + scales.xOf(p.x).toFixed(1) + "," + yr(p.r).toFixed(1)).join(" ");
      return { kind: "return", line, zeroY: yr(0), rmax };
    }
    return null;
  }, [lowerPanel, srcPts, basisRows, byYr, windowYears, scales]);

  const yearFromClientX = useCallback((clientX) => {
    const rect = svgRef.current.getBoundingClientRect();
    const vx = ((clientX - rect.left) / rect.width) * VW;
    const t = (vx - PAD_L) / (VW - PAD_L - PAD_R);
    return Math.min(viewMax, Math.max(viewMin, Math.round(viewMin + t * (viewMax - viewMin))));
  }, [viewMin, viewMax]);

  const handleKey = (e) => {
    const step = e.shiftKey ? 10 : 1;
    let next = null;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") next = Math.max(viewMin, year - step);
    if (e.key === "ArrowRight" || e.key === "ArrowUp") next = Math.min(viewMax, year + step);
    if (e.key === "Home") next = viewMin;
    if (e.key === "End") next = viewMax;
    if (next != null) { e.preventDefault(); onScrub(next); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onCommit(year); }
  };

  const cYear = Math.min(viewMax, Math.max(viewMin, year));
  const d = byYr.get(cYear) || basisRows[basisRows.length - 1];
  const cx = scales.xOf(cYear), cy = d.p > 0 ? scales.yOf(d.p) : PRICE_BOTTOM;
  const chipW = 158, chipFlip = cx > VW - chipW - 30;
  const chipX = chipFlip ? cx - chipW - 12 : cx + 12;
  const hasCape = d.cape != null;

  return (
    <div
      className="mn-chartwrap"
      role="slider"
      tabIndex={0}
      aria-label={"Year selector, " + viewMin + " to " + viewMax + ". Arrow keys to step, Shift for decades, Enter to narrate."}
      aria-valuemin={viewMin}
      aria-valuemax={viewMax}
      aria-valuenow={cYear}
      aria-valuetext={cYear + " — " + basis + " price " + Math.round(d.p) + (hasCape ? ", CAPE " + d.cape : "")}
      onKeyDown={handleKey}
    >
      <svg
        ref={svgRef}
        className="mn-svg"
        viewBox={"0 0 " + VW + " " + VH}
        aria-hidden="true"
        onPointerDown={(e) => { dragging.current = true; e.currentTarget.setPointerCapture(e.pointerId); onScrub(yearFromClientX(e.clientX)); }}
        onPointerMove={(e) => { if (dragging.current) onScrub(yearFromClientX(e.clientX)); }}
        onPointerUp={(e) => { dragging.current = false; onCommit(yearFromClientX(e.clientX)); }}
        onPointerCancel={() => { dragging.current = false; }}
      >
        {bearBands.map(([a, b], i) => (
          <rect key={i} className="mn-bear" x={scales.xOf(a)} y={PRICE_TOP}
            width={Math.max(0, scales.xOf(b) - scales.xOf(a))} height={PRICE_BOTTOM - PRICE_TOP} />
        ))}

        {scales.grid.map((p) => (
          <g key={p}>
            <line className="mn-grid" x1={PAD_L} x2={VW - PAD_R} y1={scales.yOf(p)} y2={scales.yOf(p)} />
            <text className="mn-gridlabel" x={PAD_L - 8} y={scales.yOf(p) + 3} textAnchor="end">{fmtPrice(p)}</text>
          </g>
        ))}

        <path className={"mn-line" + (drawIn ? " draw" : "")} d={pricePath} />
        {maPath && <path className="mn-ma" d={maPath} />}

        {lower && lower.kind === "cape" && (
          <React.Fragment>
            <text className="mn-axislabel" x={PAD_L - 8} y={CAPE_TOP + 6} textAnchor="end">CAPE</text>
            <path className="mn-capearea" d={lower.area} />
            <path className="mn-capeline" d={lower.line} />
          </React.Fragment>
        )}
        {lower && lower.kind === "return" && (
          <React.Fragment>
            <text className="mn-axislabel" x={PAD_L - 8} y={CAPE_TOP + 6} textAnchor="end">{windowYears}y rtn</text>
            <line className="mn-zero" x1={PAD_L} x2={VW - PAD_R} y1={lower.zeroY} y2={lower.zeroY} />
            <text className="mn-gridlabel" x={VW - PAD_R} y={CAPE_TOP + 6} textAnchor="end">+{lower.rmax}%</text>
            <text className="mn-gridlabel" x={VW - PAD_R} y={CAPE_BOTTOM} textAnchor="end">−{lower.rmax}%</text>
            <path className="mn-return" d={lower.line} />
          </React.Fragment>
        )}

        {scales.decades.map((y) => (
          <text key={y} className="mn-axislabel" x={scales.xOf(y)} y={VH - 6} textAnchor="middle">{y}</text>
        ))}

        <line className="mn-cursorline" x1={cx} x2={cx} y1={PRICE_TOP} y2={lowerPanel === "off" ? PRICE_BOTTOM : CAPE_BOTTOM} />
        <circle className="mn-cursordot" cx={cx} cy={cy} r="3.5" />

        <g transform={"translate(" + chipX + "," + Math.max(PRICE_TOP, Math.min(cy - 30, PRICE_BOTTOM - 64)) + ")"}>
          <rect className="mn-chipbox" width={chipW} height="58" rx="9" />
          <text className="mn-chipyear" x="12" y="22">{cYear}</text>
          <text className="mn-chipstat" x="12" y="38">
            ${Math.round(d.p).toLocaleString()}{hasCape ? " · CAPE " + d.cape : ""}
          </text>
          <text className="mn-chipstat" x="12" y="51">
            {d.dd <= -1 ? d.dd.toFixed(0) + "% off peak" : "at the highs"}
          </text>
        </g>
      </svg>
    </div>
  );
}

function EraStrip({ year, onPick, viewMin, viewMax }) {
  return (
    <div className="mn-eras" role="group" aria-label="Notable moments">
      {ERAS.filter(([y]) => y >= viewMin && y <= viewMax).map(([y, label]) => (
        <button
          key={y}
          type="button"
          className="mn-era"
          style={{ left: xPct(y, viewMin, viewMax) + "%" }}
          title={y + " — " + label}
          aria-label={y + " — " + label}
          aria-pressed={year === y}
          onClick={() => onPick(y)}
        />
      ))}
    </div>
  );
}

/* ── zoom track ──────────────────────────────────────────────────────────── */

function ZoomTrack({ dataMin, dataMax, viewMin, viewMax, onChange }) {
  const ref = useRef(null);
  const drag = useRef(null);
  const span = Math.max(1, dataMax - dataMin);
  const MINW = 4;
  const pct = (y) => ((y - dataMin) / span) * 100;

  const onDown = (mode) => (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture?.(e.pointerId);
    drag.current = { mode, startX: e.clientX, startMin: viewMin, startMax: viewMax };
  };
  const onMove = (e) => {
    if (!drag.current || !ref.current) return;
    const d = drag.current;
    const dyr = ((e.clientX - d.startX) / ref.current.getBoundingClientRect().width) * span;
    let nMin = d.startMin, nMax = d.startMax;
    if (d.mode === "min") nMin = Math.min(Math.max(dataMin, d.startMin + dyr), d.startMax - MINW);
    else if (d.mode === "max") nMax = Math.max(Math.min(dataMax, d.startMax + dyr), d.startMin + MINW);
    else {
      const w = d.startMax - d.startMin;
      nMin = Math.min(Math.max(dataMin, d.startMin + dyr), dataMax - w);
      nMax = nMin + w;
    }
    onChange(Math.round(nMin), Math.round(nMax));
  };
  const onUp = () => { drag.current = null; };

  const handleKey = (which) => (e) => {
    const step = e.shiftKey ? 10 : 1;
    let nMin = viewMin, nMax = viewMax, hit = true;
    if (which === "min") {
      if (e.key === "ArrowLeft") nMin = Math.max(dataMin, viewMin - step);
      else if (e.key === "ArrowRight") nMin = Math.min(viewMax - MINW, viewMin + step);
      else hit = false;
    } else {
      if (e.key === "ArrowLeft") nMax = Math.max(viewMin + MINW, viewMax - step);
      else if (e.key === "ArrowRight") nMax = Math.min(dataMax, viewMax + step);
      else hit = false;
    }
    if (hit) { e.preventDefault(); onChange(nMin, nMax); }
  };

  return (
    <div className="mn-zoom" ref={ref}>
      <div className="mn-zoom-track" />
      <div
        className="mn-zoom-sel"
        style={{ left: pct(viewMin) + "%", width: (pct(viewMax) - pct(viewMin)) + "%" }}
        onPointerDown={onDown("pan")} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
      />
      <div
        className="mn-zoom-handle" role="slider" tabIndex={0}
        aria-label="Range start" aria-valuemin={dataMin} aria-valuemax={dataMax} aria-valuenow={viewMin}
        style={{ left: pct(viewMin) + "%" }}
        onPointerDown={onDown("min")} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
        onKeyDown={handleKey("min")}
      />
      <div
        className="mn-zoom-handle" role="slider" tabIndex={0}
        aria-label="Range end" aria-valuemin={dataMin} aria-valuemax={dataMax} aria-valuenow={viewMax}
        style={{ left: pct(viewMax) + "%" }}
        onPointerDown={onDown("max")} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
        onKeyDown={handleKey("max")}
      />
    </div>
  );
}

/* ── app ─────────────────────────────────────────────────────────────────── */

const CSV_CANDIDATES = ["data.csv", "shiller.csv", "ie_data.csv"];

function App() {
  const [data, setData] = useState(buildFallback);
  const [loadError, setLoadError] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);

  // analysis controls
  const [basis, setBasis] = useState("real");
  const [axisMode, setAxisMode] = useState("log");
  const [lowerPanel, setLowerPanel] = useState("cape");
  const [windowYears, setWindowYears] = useState(10);
  const [maOn, setMaOn] = useState(false);
  const [maMonths, setMaMonths] = useState(60);
  const [bearsOn, setBearsOn] = useState(false);
  const [view, setView] = useState(null); // {min,max} | null = full range

  const [year, setYear] = useState(1929);
  const [personaId, setPersonaId] = useState("historian");
  const [status, setStatus] = useState("idle");
  const [text, setText] = useState("");
  const [narrated, setNarrated] = useState(null);
  const [perf, setPerf] = useState(null);
  const [drawIn, setDrawIn] = useState(true);
  const abortRef = useRef(null);

  const persona = PERSONAS.find((p) => p.id === personaId);
  const annual = data.annual;
  const dataMin = annual[0].year, dataMax = annual[annual.length - 1].year;
  const viewMin = view ? view.min : dataMin;
  const viewMax = view ? view.max : dataMax;
  const idx = useMemo(() => new Map(annual.map((r) => [r.year, r])), [annual]);

  const adoptCSV = useCallback((textContent, label) => {
    try {
      const parsed = parseShillerCSV(textContent, label);
      setData(parsed);
      setLoadError("");
      setView(null); // reset zoom to the new range
    } catch (e) {
      setLoadError(e.message || "Couldn't read that file.");
    }
  }, []);

  // if the loaded data has no nominal series, force real basis
  useEffect(() => { if (!data.hasNominal && basis === "nominal") setBasis("real"); }, [data, basis]);

  useEffect(() => {
    if (location.protocol === "file:") return;
    let cancelled = false;
    (async () => {
      for (const name of CSV_CANDIDATES) {
        try {
          const res = await fetch(name);
          if (!res.ok) continue;
          const body = await res.text();
          if (!cancelled && body.includes(",")) { adoptCSV(body, name); return; }
        } catch { /* served-only path */ }
      }
    })();
    return () => { cancelled = true; };
  }, [adoptCSV]);

  const narrate = useCallback((y, pId) => {
    abortRef.current?.abort();
    const controller = new AbortController();
    abortRef.current = controller;
    const target = nearestReplayYear(y);
    if (target !== y) setYear(target);
    const passage = CORPUS.passages[target + ":" + pId];
    setNarrated({ year: target, personaId: pId });
    if (!passage) { setStatus("error"); setText("No passage for " + target + " in this corpus."); return; }
    setStatus("playing"); setText("");
    replayNarration({ passage, signal: controller.signal, onDelta: (t) => setText(t) })
      .then((result) => {
        if (controller.signal.aborted) return;
        setText(result.text);
        setPerf({ ms: result.ms, ttft: result.ttft, tps: result.tps, recorded: result.recorded });
        setStatus("done");
      })
      .catch((err) => {
        if (controller.signal.aborted || err.name === "AbortError") return;
        setStatus("error"); setText(err.message || "Replay failed.");
      });
  }, []);

  useEffect(() => {
    const t = setTimeout(() => { setDrawIn(false); narrate(1929, "historian"); }, 1200);
    return () => { clearTimeout(t); abortRef.current?.abort(); };
  }, [narrate]);

  const commitYear = (y) => { setYear(y); narrate(y, personaId); };
  const pickPersona = (id) => { setPersonaId(id); narrate(year, id); };
  const onFile = (file) => { if (file) file.text().then((t) => adoptCSV(t, file.name)); };

  const handleZoom = (min, max) => {
    setView(min <= dataMin && max >= dataMax ? null : { min, max });
    setYear((y) => Math.min(max, Math.max(min, y)));
  };

  // rolling-return readout for the narration header (active basis + window)
  const rr = useMemo(() => {
    const cur = idx.get(narrated ? narrated.year : year);
    const prev = idx.get((narrated ? narrated.year : year) - windowYears);
    if (!cur || !prev) return null;
    const a = priceOf(prev, basis), b = priceOf(cur, basis);
    if (!(a > 0) || !(b > 0)) return null;
    return (Math.pow(b / a, 1 / windowYears) - 1) * 100;
  }, [idx, narrated, year, windowYears, basis]);

  const busy = status === "playing";
  const d = idx.get(Math.min(viewMax, Math.max(viewMin, year))) || annual[annual.length - 1];
  const dispPrice = priceOf(d, basis);
  const Seg = ({ value, onChange, options }) => (
    <div className="mn-seg" role="group">
      {options.map((o) => (
        <button key={o.v} type="button" aria-pressed={value === o.v}
          disabled={o.disabled} title={o.title}
          onClick={() => !o.disabled && onChange(o.v)}>{o.label}</button>
      ))}
    </div>
  );

  return (
    <div className="mn-root">
      <div className="mn-shell">

        <header className="mn-headrow">
          <div>
            <div className="mn-eyebrow">Market narration</div>
            <h1 className="mn-title">A century and a half on your terms</h1>
            <p className="mn-sub">
              The {basis} S&amp;P composite, {dataMin} → {dataMax}, after Robert Shiller's data —
              park anywhere on the line and a voice tells the era.
            </p>
          </div>
        </header>

        <section className="mn-card" aria-label="Market chart">
          <Chart data={data} year={year} onScrub={setYear} onCommit={commitYear} drawIn={drawIn}
            basis={basis} axisMode={axisMode} lowerPanel={lowerPanel} windowYears={windowYears}
            maOn={maOn} maMonths={maMonths} bearsOn={bearsOn} viewMin={viewMin} viewMax={viewMax} />
          <EraStrip year={year} onPick={commitYear} viewMin={viewMin} viewMax={viewMax} />
          <div className="mn-cardfoot">
            <span>{data.source === "csv" ? "shiller monthly · " + data.label : "approximate fallback data"}</span>
            <span>drag the chart, or tap a moment</span>
          </div>
        </section>

        <div className="mn-personas" role="group" aria-label="Narrator">
          {PERSONAS.map((p) => (
            <button key={p.id} type="button" className="mn-persona"
              aria-pressed={p.id === personaId} onClick={() => pickPersona(p.id)}>{p.label}</button>
          ))}
        </div>

        <div className="mn-bottom">
        <div className="mn-controls">
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">Price basis</span>
            <Seg value={basis} onChange={setBasis} options={[
              { v: "real", label: "Real" },
              { v: "nominal", label: "Nominal", disabled: !data.hasNominal,
                title: data.hasNominal ? "" : "Load a CSV with a nominal series" },
            ]} />
          </div>
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">Y-axis</span>
            <Seg value={axisMode} onChange={setAxisMode} options={[
              { v: "log", label: "Log" }, { v: "linear", label: "Linear" },
            ]} />
          </div>
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">Lower panel</span>
            <Seg value={lowerPanel} onChange={setLowerPanel} options={[
              { v: "cape", label: "CAPE" }, { v: "return", label: "Return" }, { v: "off", label: "Off" },
            ]} />
          </div>
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">
              <span>Rolling window</span><span className="mn-ctrl-val">{windowYears}y</span>
            </span>
            <input className="mn-range" type="range" min="1" max="30" step="1" value={windowYears}
              aria-label="Rolling return window in years"
              onChange={(e) => setWindowYears(+e.target.value)} />
          </div>
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">
              <span>Moving avg</span>
              <span className="mn-ctrl-val">{maOn ? (maMonths >= 12 ? maMonths / 12 + "y" : maMonths + "mo") : "off"}</span>
            </span>
            <input className="mn-range" type="range" min="6" max="120" step="6" value={maMonths}
              disabled={!maOn} aria-label="Moving average period in months"
              onChange={(e) => setMaMonths(+e.target.value)} />
          </div>
          <div className="mn-ctrl">
            <span className="mn-ctrl-label">Overlays</span>
            <div className="mn-chips">
              <button type="button" className="mn-chip" aria-pressed={maOn}
                style={{ "--swatch": "var(--accent)" }} onClick={() => setMaOn((v) => !v)}>
                <span className="mn-chipdot" />Moving avg
              </button>
              <button type="button" className="mn-chip" aria-pressed={bearsOn}
                style={{ "--swatch": "rgba(194,73,20,.6)" }} onClick={() => setBearsOn((v) => !v)}>
                <span className="mn-chipdot" />Bear markets
              </button>
            </div>
          </div>
          <div className="mn-ctrl" style={{ gridColumn: "1 / -1" }}>
            <span className="mn-ctrl-label mn-zoom-row">
              <span>Visible range</span>
              <button type="button" className="mn-zoom-reset" disabled={!view}
                onClick={() => setView(null)}>
                {view ? viewMin + "–" + viewMax + " · reset" : "full range"}
              </button>
            </span>
            <ZoomTrack dataMin={dataMin} dataMax={dataMax} viewMin={viewMin} viewMax={viewMax} onChange={handleZoom} />
          </div>
        </div>

        <section className="mn-narration" aria-label="Narration">
          <div className="mn-narrhead">
            <span>{narrated ? narrated.year : year} · {persona.label.toLowerCase()}</span>
            <span>
              ${Math.round(dispPrice).toLocaleString()}
              {d.cape != null ? " · CAPE " + d.cape : ""}
              {rr != null ? " · " + windowYears + "y " + (rr >= 0 ? "+" : "") + rr.toFixed(1) + "%/yr" : ""}
            </span>
          </div>

          <div className="mn-text" aria-live="polite">
            {status === "error" ? (
              <div className="mn-error">{text}</div>
            ) : text ? (
              <React.Fragment>{text}{busy && <span className="caret" aria-hidden="true" />}</React.Fragment>
            ) : (
              <span className="mn-placeholder">{busy ? "Listening for the first words…" : "Pick a year to begin."}</span>
            )}
          </div>

          <div className="mn-narrfoot">
            replay · {REPLAY_YEARS.length} moments × {PERSONAS.length} voices
          </div>
        </section>
        </div>

        <p className="mn-footnote">
          For demo purposes only - not an investment advice.
        </p>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
